services:
  - type: web
    name: morty69-services
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ADMIN_KEY
        sync: false
      - key: DISCORD_WEBHOOK
        sync: false
    disk:
      name: morty69-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
